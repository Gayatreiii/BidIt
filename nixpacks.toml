# nixpacks.toml for Railway deployment of Reflex app
[phases.setup]
nixPkgs = ["unzip", "curl"]

[phases.install]
cmds = [
    "pip install --upgrade pip",
    "pip install -r requirements.txt",
    "curl -fsSL https://bun.sh/install | bash"
]

[phases.build]
cmds = [
    "export PATH=$HOME/.bun/bin:$PATH && reflex init"
]

[start]
cmd = "bash start.sh"
